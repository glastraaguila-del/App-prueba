// ─── Sound engine — layered pop ───────────────────────────────────────────────
// Three simultaneous layers per pop:
//   1. Body thud — low sine, the “mass” of the bubble
//   2. Air release — filtered noise burst, the “breath”
//   3. Plastic click — very short triangle transient
// Each bubble gets a unique pitchSeed so no two pops sound identical.
// pressDuration (ms) affects the character: slow press = deeper/wetter, fast = snappier.
function useSound() {
const actx = useRef(null);

return useCallback((pitchSeed = 1.0, special = false, pressDuration = 80) => {
try {
if (!actx.current) actx.current = new (window.AudioContext || window.webkitAudioContext)();
const ac = actx.current, now = ac.currentTime;

```
  // How "slow" was the press? 0=instant, 1=very slow (>300ms)
  const slowness = Math.min(pressDuration / 300, 1);

  const baseFreq = special ? 72 : 95 + slowness * (-22); // slower = lower pitch
  const f = baseFreq * pitchSeed;

  // ── Layer 1: body thud ──
  // Sine drops quickly — the "pop" mass. Slower press = longer decay.
  const o1 = ac.createOscillator(), g1 = ac.createGain();
  o1.connect(g1); g1.connect(ac.destination);
  o1.type = "sine";
  o1.frequency.setValueAtTime(f, now);
  o1.frequency.exponentialRampToValueAtTime(f * 0.38, now + 0.14 + slowness * 0.08);
  g1.gain.setValueAtTime(0, now);
  g1.gain.linearRampToValueAtTime(special ? 0.42 : 0.32, now + 0.006);
  g1.gain.exponentialRampToValueAtTime(0.001, now + 0.20 + slowness * 0.10);
  o1.start(now); o1.stop(now + 0.32);

  // ── Layer 2: sub thud (octave below) — warmth ──
  const o2 = ac.createOscillator(), g2 = ac.createGain();
  o2.connect(g2); g2.connect(ac.destination);
  o2.type = "sine";
  o2.frequency.setValueAtTime(f * 0.5, now);
  o2.frequency.exponentialRampToValueAtTime(f * 0.18, now + 0.16);
  g2.gain.setValueAtTime(0, now);
  g2.gain.linearRampToValueAtTime(special ? 0.22 : 0.14, now + 0.008);
  g2.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
  o2.start(now); o2.stop(now + 0.26);

  // ── Layer 3: air release — bandpass noise ──
  // Centred ~600-900 Hz, very short. Fast press = more air, slow = less.
  const noiseLen = Math.floor(ac.sampleRate * (0.04 + (1 - slowness) * 0.04));
  const buf = ac.createBuffer(1, noiseLen, ac.sampleRate);
  const nd = buf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) nd[i] = Math.random() * 2 - 1;
  const ns = ac.createBufferSource(); ns.buffer = buf;
  const bpf = ac.createBiquadFilter();
  bpf.type = "bandpass";
  bpf.frequency.value = 680 + pitchSeed * 180;  // varies per bubble
  bpf.Q.value = 1.8;
  const gn = ac.createGain();
  ns.connect(bpf); bpf.connect(gn); gn.connect(ac.destination);
  const airVol = special ? 0.10 : 0.065 + (1 - slowness) * 0.03;
  gn.gain.setValueAtTime(airVol, now);
  gn.gain.exponentialRampToValueAtTime(0.001, now + 0.07 + (1 - slowness) * 0.04);
  ns.start(now); ns.stop(now + 0.12);

  // ── Layer 4: plastic click — ultra-short triangle transient ──
  const o4 = ac.createOscillator(), g4 = ac.createGain();
  o4.connect(g4); g4.connect(ac.destination);
  o4.type = "triangle";
  o4.frequency.setValueAtTime(f * 3.2, now);
  o4.frequency.exponentialRampToValueAtTime(f * 1.1, now + 0.018);
  g4.gain.setValueAtTime(special ? 0.18 : 0.11, now);
  g4.gain.exponentialRampToValueAtTime(0.001, now + 0.022);
  o4.start(now); o4.stop(now + 0.025);

  // ── Special: extra low resonance ──
  if (special) {
    const os = ac.createOscillator(), gs = ac.createGain();
    os.connect(gs); gs.connect(ac.destination);
    os.type = "sine"; os.frequency.setValueAtTime(38, now);
    gs.gain.setValueAtTime(0.28, now); gs.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    os.start(now); os.stop(now + 0.38);
  }
} catch {}

const nodes   = useRef([]);
const started = useRef(false);
const noteTimer = useRef(null); // setTimeout for next piano note

const start = useCallback(() => {
if (started.current) return;
try {
if (!actx.current) actx.current = new (window.AudioContext || window.webkitAudioContext)();
const ac = actx.current;
if (ac.state === “suspended”) ac.resume();
started.current = true;

```
  // ── Brown noise (looping, continuous) ────────────────────────────
  // Use shorter buffer to avoid stack overflow on Math.max spread
  const SR     = ac.sampleRate;
  const bufLen = SR * 3; // 3s loop
  const buf    = ac.createBuffer(1, bufLen, SR);
  const data   = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < bufLen; i++) {
    const w = (Math.random() * 2 - 1) * 0.02;
    data[i] = (last + w) / 1.02;
    last = data[i];
  }
  // Normalize without spread (avoids call stack overflow)
  let peak = 0;
  for (let i = 0; i < bufLen; i++) { const a = Math.abs(data[i]); if (a > peak) peak = a; }
  if (peak > 0) for (let i = 0; i < bufLen; i++) data[i] /= peak;

  const noise = ac.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  const lpf = ac.createBiquadFilter(); lpf.type = "lowpass"; lpf.frequency.value = 600;
  const masterGain = ac.createGain(); masterGain.gain.value = 0.07;
  noise.connect(lpf); lpf.connect(masterGain); masterGain.connect(ac.destination);
  noise.start();
  nodes.current.push(noise);

  // ── Sparse piano (pentatonic minor, very soft) ───────────────────
  const pentatonic = [130.81, 155.56, 174.61, 196.00, 233.08, 261.63];
  const playNote = () => {
    // Guard: stop if engine was shut down
    if (!actx.current || !started.current) return;
    const now = actx.current.currentTime;
    const freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
    const vol  = 0.035 + Math.random() * 0.035;

    const o  = actx.current.createOscillator();
    const g  = actx.current.createGain();
    const o2 = actx.current.createOscillator();
    const g2 = actx.current.createGain();

    o.type = "sine";  o.frequency.value = freq;
    o2.type = "sine"; o2.frequency.value = freq * 2;
    o.connect(g);   g.connect(actx.current.destination);
    o2.connect(g2); g2.connect(actx.current.destination);

    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.04);
    g.gain.exponentialRampToValueAtTime(0.001, now + 3.5);

    g2.gain.setValueAtTime(0, now);
    g2.gain.linearRampToValueAtTime(vol * 0.2, now + 0.04);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

    o.start(now);  o.stop(now + 4);
    o2.start(now); o2.stop(now + 2);
    nodes.current.push(o, o2);

    // Next note in 4-10s
    noteTimer.current = setTimeout(playNote, 4000 + Math.random() * 6000);
  };

  // First note after 1.5s
  noteTimer.current = setTimeout(playNote, 1500);

} catch(e) { console.error("Music start error:", e); }

function useAnimatedScore(target) {
const [display, setDisplay] = useState(target);
const prev = useRef(target);
useEffect(() => {
const diff = target - prev.current;
if (diff <= 0) { setDisplay(target); prev.current = target; return; }
const steps = Math.min(diff, 8); let i = 0;
const id = setInterval(() => {
i++; setDisplay(Math.round(prev.current + diff * i / steps));
if (i >= steps) { clearInterval(id); prev.current = target; }
}, 28);
return () => clearInterval(id);
}, [target]);
return display;
}

function useGameLogic() {
const playSound = useSound();
const updateStats = useCallback((patch) => {
const prev = load(“stats”, { totalPopped: 0, maxCombo: 0 });
const next = { …prev };
for (const [k, v] of Object.entries(patch))
next[k] = k === “maxCombo” ? Math.max(next[k] || 0, v) : (next[k] || 0) + v;
store(“stats”, next);
if (patch.totalPopped) store(“coins”, load(“coins”, 0) + Math.floor(patch.totalPopped / 10));
}, []);
return { playSound, updateStats };
}

function FlatBubble({ size, rnd = 0.5, rnd2 = 0.5 }) {

// Helper: edge-to-edge wrinkle — starts near one rim, curves across, ends near opposite rim
function edgeWrinkle(rnd, rnd2, angle, offset, depth) {
const a = angle * Math.PI / 180;
const perp = (angle + 90) * Math.PI / 180;
const r = 42; // near the rim
const startOffset = offset * 2 - 1; // -1 to +1
// Start/end points on opposite sides of the circle
const x0 = 50 + r * Math.cos(a + startOffset * 0.3);
const y0 = 50 + r * Math.sin(a + startOffset * 0.3);
const x1 = 50 - r * Math.cos(a - startOffset * 0.2);
const y1 = 50 - r * Math.sin(a - startOffset * 0.2);
// Control point: offset perpendicularly for natural bow
const bow = (depth * 2 - 1) * 16;
const xm = (x0+x1)/2 + bow * Math.cos(perp);
const ym = (y0+y1)/2 + bow * Math.sin(perp);
return { x0, y0, xm, ym, x1, y1 };
}

// BUBBLE CELL — pressure-sensitive pop
// Mechanic: light/quick touch = bubble stretches but doesn’t pop (cancelled on lift)
//           hold 40ms OR measured pressure ≥ 0.4 = pop
// ═══════════════════════════════════════════════════════════════════════════════
function BubbleCell({ bubble, bubbleSize, onPop, sheetRef, skin }) {
const { popped, rnd, rnd2, pitchSeed, special } = bubble;
const [state, setState]       = useState(popped ? “broken” : “intact”);
const [squish, setSquish]     = useState(0); // 0-1 compression depth for visual
const cellRef    = useRef(null);
const pressTime  = useRef(null);
const popTimer   = useRef(null);
const squishFrame= useRef(null);
const didPop     = useRef(false);

useEffect(() => { setState(popped ? “broken” : “intact”); }, [popped]);
useEffect(() => () => {
if (popTimer.current)    clearTimeout(popTimer.current);
if (squishFrame.current) cancelAnimationFrame(squishFrame.current);
}, []);

const getCenter = () => {
if (!cellRef.current || !sheetRef.current) return { cx: 0, cy: 0 };
const cr = cellRef.current.getBoundingClientRect();
const sr = sheetRef.current.getBoundingClientRect();
return { cx: cr.left - sr.left + cr.width / 2, cy: cr.top - sr.top + cr.height / 2 };
};

const doPop = (pressDuration) => {
if (didPop.current) return;
didPop.current = true;
if (popTimer.current) clearTimeout(popTimer.current);
setSquish(0);
setState(“popping”);
haptic(special ? “heavy” : “light”);
const { cx, cy } = getCenter();
onPop(cx, cy, pitchSeed, special, pressDuration);
setTimeout(() => setState(“broken”), 260);
};

const POP_THRESHOLD = 50; // ms — must hold this long to pop

const handleDown = (e) => {
e.preventDefault();
if (state !== “intact”) return;
didPop.current = false;
pressTime.current = Date.now();
setState(“pressing”);

```
// Animate squish: grows from 0→1 over POP_THRESHOLD ms
const startTime = Date.now();
const animSquish = () => {
  const elapsed = Date.now() - startTime;
  const s = Math.min(elapsed / POP_THRESHOLD, 1);
  setSquish(s);
  if (s < 1 && !didPop.current) squishFrame.current = requestAnimationFrame(animSquish);
};
squishFrame.current = requestAnimationFrame(animSquish);

// Check pointer pressure if supported
const pressure = e.pressure || 0;
if (pressure >= 0.55) {
  setTimeout(() => doPop(0), 8);
  return;
}

// Pop after 50ms hold
popTimer.current = setTimeout(() => {
  doPop(Date.now() - pressTime.current);
}, POP_THRESHOLD);
```

};

const handleUp = (e) => {
e.preventDefault();
if (state !== “pressing”) return;
const held = Date.now() - (pressTime.current || Date.now());

```
if (squishFrame.current) cancelAnimationFrame(squishFrame.current);
setSquish(0);

// Released before threshold — spring back, no pop
if (!didPop.current && held < POP_THRESHOLD) {
  if (popTimer.current) clearTimeout(popTimer.current);
  setState("intact");
}
```

};

const handleLeave = () => {
if (state === “pressing” && !didPop.current) {
if (popTimer.current) clearTimeout(popTimer.current);
if (squishFrame.current) cancelAnimationFrame(squishFrame.current);
setSquish(0);
setState(“intact”);
}
};

const sz = bubbleSize;
const isPressed = state === “pressing”;

// Squish transform: scaleY decreases, scaleX increases slightly (volume conservation)
const squishScaleY = 1 - squish * 0.28;
const squishScaleX = 1 + squish * 0.10;

return (
<div ref={cellRef}
style={{
width: sz, height: sz, flexShrink: 0,
display: “flex”, alignItems: “center”, justifyContent: “center”,
cursor: (state === “intact” || isPressed) ? “pointer” : “default”,
position: “relative”, overflow: “visible”,
…(special && state === “intact” ? { filter: “drop-shadow(0 0 3px rgba(220,180,100,0.32))” } : {}),
}}
onPointerDown={handleDown} onPointerUp={handleUp} onPointerLeave={handleLeave}
>
{(state === “intact” || isPressed) && (
<div style={{
transform: isPressed ? `scaleY(${squishScaleY}) scaleX(${squishScaleX})` : “scale(1)”,
transition: isPressed ? “none” : “transform 0.15s cubic-bezier(.34,1.5,.64,1)”,
transformOrigin: “center bottom”,
}}>
<IntactBubble size={sz * 0.98} skinFilter={skin?.hue || null}
rnd={rnd} rnd2={rnd2} pressed={false} special={special} />
</div>
)}
{state === “popping” && <BurstBubble size={sz * (special ? 1.15 : 1.05)} special={special} />}
{state === “broken”  && <FlatBubble  size={sz * 0.98} rnd={rnd} rnd2={rnd2} />}
</div>
);
}

function ZenBg() {
const ripples = useRef(
Array.from({ length: 28 }, (_, i) => ({
y:   4 + i * 5.8 + (Math.random() - 0.5) * 2.2,
amp: 0.6 + Math.random() * 1.2,
freq: 0.018 + Math.random() * 0.014,
phase: Math.random() * Math.PI * 2,
op: 0.10 + Math.random() * 0.14,
dark: Math.random() > 0.5,
}))
).current;

// Build wavy path for each ripple
const wavePath = (y, amp, freq, phase) => {
const pts = Array.from({ length: 22 }, (_, i) => {
const x = i * (100 / 21);
const dy = amp * Math.sin(freq * x * Math.PI * 2 + phase);
return `${x.toFixed(1)},${(y + dy).toFixed(2)}`;
});
return `M ${pts.join(" L ")}`;
};

return (
<div style={{ position:“fixed”, inset:0, zIndex:0, pointerEvents:“none”, overflow:“hidden” }}>
{/* Sand base gradient — warm, slightly uneven like natural sand */}

function ChillMode({ onMenu, skin, soundSkin }) {
const VISIBLE_ROWS = 12, BATCH = 6;
const [rows, setRows]           = useState(() => makeRows(VISIBLE_ROWS + BATCH));
const [score, setScore]         = useState(0);
const [hs, setHs]               = useState(() => load(“hs_chill”, 0));
const [splashes, setSplashes]   = useState([]);
const [combo, setCombo]         = useState(0);
const [audioMode, setAudioMode] = useState(“both”);
const scrollRef = useRef(null), sheetRef = useRef(null);
const comboRef = useRef(0), comboTimer = useRef(null), scoreRef = useRef(0);
const { playSound, updateStats } = useGameLogic();
const { start: startMusic, stop: stopMusic, destroy: destroyMusic } = useZenMusic();
const { onScroll: onScrollSound } = useScrollSound();
const displayScore = useAnimatedScore(score);
const currentSkin = SKINS[skin] || SKINS.classic;

useEffect(() => { scoreRef.current = score; }, [score]);

// Music starts on first user interaction (first bubble pop) due to browser autoplay policy.
// AudioContext requires a user gesture — we trigger it the moment the first pop fires.
const musicStarted = useRef(false);
const ensureMusic = useCallback(() => {
if (musicStarted.current || audioModeRef.current === “off” || audioModeRef.current === “bubbles”) return;
musicStarted.current = true;
startMusic();
}, [startMusic]);

useEffect(() => () => destroyMusic(), []);

const cycleAudio = () => setAudioMode(prev => {
if (prev === “both”)    { stopMusic(); musicStarted.current = false; return “bubbles”; }
if (prev === “bubbles”) { return “off”; }
// off → both: start immediately since we already have a user gesture context

setRows(prev => […prev, …makeRows(BATCH)]);

setRows(prev => {

return next;

const sp = makeSplash(cx, cy, special);

setTimeout(() => setSplashes(s => s.filter(x => !sp.find(n => n.id === x.id))), 480);
}, [playSound, updateStats, ensureMusic]);
