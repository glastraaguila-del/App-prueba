<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>paste</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  touch-action: none; -webkit-tap-highlight-color: transparent;
  background: #f5f2ed; user-select: none;
}
#c { position: fixed; top: 0; left: 0; display: block; touch-action: none; }

#tray {
position: fixed; bottom: 48px; left: 0; right: 0; height: 130px;
background: #111; display: flex; align-items: center;
padding: 0 12px; gap: 10px;
overflow-x: auto; overflow-y: hidden;
touch-action: pan-x; -webkit-overflow-scrolling: touch;
scrollbar-width: none; z-index: 10;
}
#tray::-webkit-scrollbar { display: none; }

.thumb {
flex-shrink: 0; height: 100px; overflow: hidden; border-radius: 2px;
}
.thumb.loading {
width: 80px;
background: #222;
animation: pulse 1s ease-in-out infinite;
}
.thumb.ready {
background: repeating-conic-gradient(#2a2a2a 0% 25%,#1e1e1e 0% 50%) 0 0/8px 8px;
}
.thumb canvas { display: block; height: 100%; width: auto; pointer-events: none; }
@keyframes pulse { 0%,100%{opacity:.2} 50%{opacity:.5} }

#searchbar {
position: fixed; bottom: 0; left: 0; right: 0; height: 48px;
background: #1a1a1a; display: flex; align-items: center;
padding: 0 14px; gap: 10px; z-index: 10;
}
#searchbar input {
flex: 1; height: 32px; background: #2a2a2a; border: none;
border-radius: 16px; padding: 0 14px; color: #fff;
font-size: 14px; font-family: monospace; outline: none;
}
#searchbar input::placeholder { color: rgba(255,255,255,0.25); }

.icon-btn {
width: 32px; height: 32px; border-radius: 50%; background: #2a2a2a;
border: none; cursor: pointer; display: flex; align-items: center;
justify-content: center; flex-shrink: 0; padding: 0;
}
.icon-btn:active { background: #3a3a3a; }

.fab {
position: fixed; width: 40px; height: 40px; border-radius: 50%;
background: #111; border: none; display: flex; align-items: center;
justify-content: center; z-index: 20; box-shadow: 0 2px 12px rgba(0,0,0,0.3);
opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.1s;
cursor: pointer; padding: 0;
}
.fab.on { opacity: 1; pointer-events: auto; }
.fab:active { transform: scale(0.88); }
#btn-save { right: 14px; }
#btn-undo { left: 14px; }

#ghost {
position: fixed; pointer-events: none; z-index: 999; display: none;
transform-origin: center center; overflow: hidden; opacity: 0.9;
box-shadow: 4px 12px 28px rgba(0,0,0,0.28);
}
#ghost canvas { display: block; width: 100%; height: 100%; }
</style>

</head>
<body>

<canvas id="c"></canvas>

<div id="tray"></div>

<div id="searchbar">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;opacity:.3">
    <circle cx="6.5" cy="6.5" r="4.5" stroke="white" stroke-width="1.5"/>
    <line x1="10" y1="10" x2="14.5" y2="14.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="buscar fotos…">
  <button class="icon-btn" id="btn-search">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <polyline points="2,7 7,2 12,7" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="7" y1="2.5" x2="7" y2="12" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="icon-btn" id="btn-refresh">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M12 7A5 5 0 1 1 9 2.5" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
      <polyline points="9,1 9,3.5 11.5,3.5" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<button class="fab" id="btn-save">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <line x1="8" y1="2" x2="8" y2="11" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <polyline points="4,8 8,12.5 12,8" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="2.5" y1="14" x2="13.5" y2="14" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</button>
<button class="fab" id="btn-undo">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <path d="M3.5 5.5H9a4 4 0 0 1 0 8H5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="6.5,2.5 3.5,5.5 6.5,8.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<div id="ghost"><canvas></canvas></div>

<script>
'use strict';

// ─────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────
const THUMB_H      = 100;
const THUMB_COUNT  = 12;  // fewer = faster initial load
const ITEM_SCALE   = 1.9;
const ASPECTS      = [0.8,1.1,0.75,1.2,0.9,1.0,0.85,1.15,0.7,1.25,0.95,1.05];
const RAND_TERMS   = ['portrait','fashion','nature','architecture','vintage',
                      'people','flowers','abstract','city','minimal'];
const BOTTOM       = 178;

// ─────────────────────────────────────────────────────
// CANVAS SETUP
// ─────────────────────────────────────────────────────
const cvs  = document.getElementById('c');
const ctx  = cvs.getContext('2d');
const tray = document.getElementById('tray');

function resize() {
  cvs.width  = window.innerWidth;
  cvs.height = window.innerHeight - BOTTOM;
  cvs.style.cssText = `width:${cvs.width}px;height:${cvs.height}px;bottom:${BOTTOM}px;`;
  positionFabs(); redraw();
}
function positionFabs() {
  const y = window.innerHeight - BOTTOM - 52;
  document.getElementById('btn-save').style.top = y + 'px';
  document.getElementById('btn-undo').style.top = y + 'px';
}
window.addEventListener('resize', resize);

// ─────────────────────────────────────────────────────
// COORDINATES
// ─────────────────────────────────────────────────────
let panX = 0, panY = 0, zoom = 1;
function clientToCanvas(sx, sy) { const r = cvs.getBoundingClientRect(); return [sx-r.left, sy-r.top]; }
function canvasToWorld(cx, cy)  { return [(cx-panX)/zoom, (cy-panY)/zoom]; }
function worldToCanvas(wx, wy)  { return [wx*zoom+panX, wy*zoom+panY]; }

// ─────────────────────────────────────────────────────
// ITEMS
// ─────────────────────────────────────────────────────
let items=[], zTop=0, idSeq=0, undoStack=[];

function updateUI() {
  const has = items.length > 0;
  document.getElementById('btn-save').classList.toggle('on', has);
  document.getElementById('btn-undo').classList.toggle('on', has);
}

// ─────────────────────────────────────────────────────
// DRAW
// ─────────────────────────────────────────────────────
function redraw() {
  ctx.clearRect(0,0,cvs.width,cvs.height);
  ctx.fillStyle = '#f5f2ed';
  ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  const gs = 32*zoom, ox = ((panX%gs)+gs)%gs, oy = ((panY%gs)+gs)%gs;
  for (let x=ox; x<cvs.width+gs; x+=gs)
    for (let y=oy; y<cvs.height+gs; y+=gs) { ctx.beginPath(); ctx.arc(x,y,1,0,Math.PI*2); ctx.fill(); }
  for (const item of [...items].sort((a,b)=>a.z-b.z)) {
    const [cx,cy] = worldToCanvas(item.wx, item.wy);
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(item.rot*Math.PI/180); ctx.scale(item.sc*zoom,item.sc*zoom);
    ctx.shadowColor='rgba(0,0,0,0.2)'; ctx.shadowBlur=16; ctx.shadowOffsetX=2; ctx.shadowOffsetY=6;
    ctx.drawImage(item.src,-item.w/2,-item.h/2,item.w,item.h);
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────
// HIT TEST
// ─────────────────────────────────────────────────────
function hitTest(cx, cy) {
  for (const item of [...items].sort((a,b)=>b.z-a.z)) {
    const [icx,icy] = worldToCanvas(item.wx,item.wy);
    const dx=cx-icx, dy=cy-icy, rad=-item.rot*Math.PI/180;
    const lx=(dx*Math.cos(rad)-dy*Math.sin(rad))/(item.sc*zoom);
    const ly=(dx*Math.sin(rad)+dy*Math.cos(rad))/(item.sc*zoom);
    if (Math.abs(lx)<=item.w/2 && Math.abs(ly)<=item.h/2) return item;
  }
  return null;
}

// ─────────────────────────────────────────────────────
// TAP
// ─────────────────────────────────────────────────────
let lastTap = null;
function handleTap(item, cx, cy) {
  const now = Date.now();
  const dbl = lastTap && lastTap.id===item.id && now-lastTap.time<320 && Math.hypot(cx-lastTap.cx,cy-lastTap.cy)<30;
  if (dbl) {
    [...items].sort((a,b)=>a.z-b.z).forEach((p,i)=>{ p.z=i+1; });
    item.z=0; lastTap=null;
  } else {
    const next = items.filter(p=>p.id!==item.id&&p.z>item.z).sort((a,b)=>a.z-b.z)[0];
    if (next) { const t=item.z; item.z=next.z; next.z=t; }
    lastTap = { id:item.id, time:now, cx, cy };
  }
  redraw();
}

// ─────────────────────────────────────────────────────
// CANVAS TOUCH + MOUSE
// ─────────────────────────────────────────────────────
let activeTouches={}, panStart=null, pinchStart=null, dragItem=null, pinchItem=null;

cvs.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) { const [cx,cy]=clientToCanvas(t.clientX,t.clientY); activeTouches[t.identifier]={cx,cy}; }
  if (e.touches.length===1) {
    const [cx,cy]=clientToCanvas(e.touches[0].clientX,e.touches[0].clientY);
    const hit=hitTest(cx,cy);
    if (hit) { hit.z=++zTop; dragItem={item:hit,tid:e.touches[0].identifier,cx0:cx,cy0:cy,wx0:hit.wx,wy0:hit.wy,moved:false}; panStart=null; }
    else { panStart={panX,panY,cx0:cx,cy0:cy}; dragItem=null; }
    pinchStart=null; pinchItem=null;
  } else if (e.touches.length===2) {
    const [ta,tb]=[e.touches[0],e.touches[1]];
    const [cxa,cya]=clientToCanvas(ta.clientX,ta.clientY), [cxb,cyb]=clientToCanvas(tb.clientX,tb.clientY);
    const ha=hitTest(cxa,cya), hb=hitTest(cxb,cyb);
    if (ha&&hb&&ha.id===hb.id) {
      const d=Math.hypot(cxa-cxb,cya-cyb), ang=Math.atan2(cyb-cya,cxb-cxa);
      pinchItem={item:ha,tids:[ta.identifier,tb.identifier],d0:d,sc0:ha.sc,ang0:ang,rot0:ha.rot};
      dragItem=null; panStart=null; pinchStart=null;
    } else {
      pinchStart={panX,panY,zoom,d0:Math.hypot(cxa-cxb,cya-cyb),mx0:(cxa+cxb)/2,my0:(cya+cyb)/2};
      dragItem=null; panStart=null; pinchItem=null;
    }
  }
  redraw();
}, {passive:false});

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) { const [cx,cy]=clientToCanvas(t.clientX,t.clientY); if(activeTouches[t.identifier]) activeTouches[t.identifier]={cx,cy}; }
  if (dragItem&&e.touches.length===1) {
    for (const t of e.touches) {
      if (t.identifier!==dragItem.tid) continue;
      const [cx,cy]=clientToCanvas(t.clientX,t.clientY);
      const dx=cx-dragItem.cx0, dy=cy-dragItem.cy0;
      if (Math.hypot(dx,dy)>5) dragItem.moved=true;
      dragItem.item.wx=dragItem.wx0+dx/zoom; dragItem.item.wy=dragItem.wy0+dy/zoom;
    }
  }
  if (pinchItem&&e.touches.length>=2) {
    let ta=null,tb=null;
    for (const t of e.touches) { if(t.identifier===pinchItem.tids[0])ta=t; if(t.identifier===pinchItem.tids[1])tb=t; }
    if (ta&&tb) {
      const [cxa,cya]=clientToCanvas(ta.clientX,ta.clientY), [cxb,cyb]=clientToCanvas(tb.clientX,tb.clientY);
      pinchItem.item.sc=Math.max(0.1,Math.min(6,pinchItem.sc0*Math.hypot(cxa-cxb,cya-cyb)/pinchItem.d0));
      pinchItem.item.rot=pinchItem.rot0+(Math.atan2(cyb-cya,cxb-cxa)-pinchItem.ang0)*180/Math.PI;
    }
  }
  if (pinchStart&&e.touches.length>=2) {
    const [ta,tb]=[e.touches[0],e.touches[1]];
    const [cxa,cya]=clientToCanvas(ta.clientX,ta.clientY), [cxb,cyb]=clientToCanvas(tb.clientX,tb.clientY);
    const d=Math.hypot(cxa-cxb,cya-cyb), mx=(cxa+cxb)/2, my=(cya+cyb)/2;
    const nz=Math.max(0.08,Math.min(10,pinchStart.zoom*d/pinchStart.d0)), r=nz/pinchStart.zoom;
    panX=mx-r*(pinchStart.mx0-pinchStart.panX); panY=my-r*(pinchStart.my0-pinchStart.panY); zoom=nz;
  }
  if (panStart&&e.touches.length===1) {
    const [cx,cy]=clientToCanvas(e.touches[0].clientX,e.touches[0].clientY);
    panX=panStart.panX+(cx-panStart.cx0); panY=panStart.panY+(cy-panStart.cy0);
  }
  redraw();
}, {passive:false});

cvs.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) delete activeTouches[t.identifier];
  if (e.touches.length===0) {
    if (dragItem&&!dragItem.moved) handleTap(dragItem.item,dragItem.cx0,dragItem.cy0);
    dragItem=null; pinchItem=null; panStart=null; pinchStart=null;
  }
  if (e.touches.length<2) pinchItem=null;
  redraw();
}, {passive:false});

let mouseState=null, mouseClickItem=null;
cvs.addEventListener('mousedown', e => {
  const [cx,cy]=clientToCanvas(e.clientX,e.clientY), hit=hitTest(cx,cy);
  mouseClickItem=hit?{item:hit,cx,cy,moved:false}:null;
  if (hit) { hit.z=++zTop; mouseState={type:'drag',item:hit,cx0:cx,cy0:cy,wx0:hit.wx,wy0:hit.wy}; }
  else mouseState={type:'pan',panX,panY,cx0:cx,cy0:cy};
});
document.addEventListener('mousemove', e => {
  if (!mouseState) return;
  const [cx,cy]=clientToCanvas(e.clientX,e.clientY);
  if (mouseState.type==='drag') {
    const dx=cx-mouseState.cx0, dy=cy-mouseState.cy0;
    if (mouseClickItem&&Math.hypot(dx,dy)>4) mouseClickItem.moved=true;
    mouseState.item.wx=mouseState.wx0+dx/zoom; mouseState.item.wy=mouseState.wy0+dy/zoom;
  } else { panX=mouseState.panX+(cx-mouseState.cx0); panY=mouseState.panY+(cy-mouseState.cy0); }
  redraw();
});
document.addEventListener('mouseup', () => {
  if (mouseClickItem&&!mouseClickItem.moved) handleTap(mouseClickItem.item,mouseClickItem.cx,mouseClickItem.cy);
  mouseClickItem=null; mouseState=null;
});
cvs.addEventListener('wheel', e => {
  e.preventDefault();
  const nz=Math.max(0.08,Math.min(10,zoom*(e.deltaY>0?0.9:1.1))), [cx,cy]=clientToCanvas(e.clientX,e.clientY);
  panX=cx-(cx-panX)*nz/zoom; panY=cy-(cy-panY)*nz/zoom; zoom=nz; redraw();
}, {passive:false});

// ─────────────────────────────────────────────────────
// GHOST / DROP
// ─────────────────────────────────────────────────────
const ghost=document.getElementById('ghost'), ghostCanvas=ghost.querySelector('canvas'), ghostCtx=ghostCanvas.getContext('2d');
let ghostSrc=null, ghostW=0, ghostH=0, ghostRot=0;
let trayTouchId=null, trayStartX=0, trayStartY=0, trayDragging=false, trayScrolling=false, mouseTrayActive=false;

tray.addEventListener('touchstart', e => {
  const thumb=e.target.closest('.thumb');
  if (!thumb?._src) return;
  const t=e.changedTouches[0];
  trayTouchId=t.identifier; trayStartX=t.clientX; trayStartY=t.clientY; trayDragging=false; trayScrolling=false;
}, {passive:true});

tray.addEventListener('touchmove', e => {
  if (trayTouchId===null) return;
  let t=null; for (const touch of e.touches) if (touch.identifier===trayTouchId){t=touch;break;}
  if (!t) return;
  const dx=t.clientX-trayStartX, dy=trayStartY-t.clientY;
  if (!trayDragging&&!trayScrolling) {
    if (Math.abs(dx)>Math.abs(dy)+5){trayScrolling=true;return;}
    if (dy>12) {
      e.preventDefault();
      const thumb=document.elementFromPoint(trayStartX,trayStartY)?.closest('.thumb');
      if (!thumb?._src) return;
      startGhost(thumb,t.clientX,t.clientY); trayDragging=true;
    }
    return;
  }
  if (trayDragging) { e.preventDefault(); ghost.style.left=(t.clientX-ghostW/2)+'px'; ghost.style.top=(t.clientY-ghostH/2)+'px'; }
}, {passive:false});

tray.addEventListener('touchend', ()=>{ if(trayDragging)commitDrop(); trayTouchId=null; trayDragging=false; }, {passive:true});
tray.addEventListener('mousedown', e => {
  const thumb=e.target.closest('.thumb'); if (!thumb?._src) return;
  e.preventDefault(); startGhost(thumb,e.clientX,e.clientY); mouseTrayActive=true;
});
document.addEventListener('mousemove', e=>{ if(mouseTrayActive){ghost.style.left=(e.clientX-ghostW/2)+'px';ghost.style.top=(e.clientY-ghostH/2)+'px';} });
document.addEventListener('mouseup', ()=>{ if(mouseTrayActive){mouseTrayActive=false;commitDrop();} });

function startGhost(thumb, cx, cy) {
  ghostSrc=thumb._src; ghostW=Math.round(thumb._w*ITEM_SCALE); ghostH=Math.round(thumb._h*ITEM_SCALE); ghostRot=(Math.random()-0.5)*20;
  ghost.style.cssText=`display:block;width:${ghostW}px;height:${ghostH}px;left:${cx-ghostW/2}px;top:${cy-ghostH/2}px;transform:rotate(${ghostRot}deg);`;
  ghostCanvas.width=ghostW; ghostCanvas.height=ghostH; ghostCtx.clearRect(0,0,ghostW,ghostH); ghostCtx.drawImage(ghostSrc,0,0,ghostW,ghostH);
}
function commitDrop() {
  const gr=ghost.getBoundingClientRect(); ghost.style.display='none';
  const [ccx,ccy]=clientToCanvas(gr.left+gr.width/2,gr.top+gr.height/2);
  if (ccx<0||ccy<0||ccx>cvs.width||ccy>cvs.height) return;
  const [wx,wy]=canvasToWorld(ccx,ccy);
  items.push({id:++idSeq,src:ghostSrc,w:ghostW,h:ghostH,wx,wy,rot:ghostRot,sc:1,z:++zTop});
  undoStack.push(idSeq); updateUI(); redraw();
}

// ─────────────────────────────────────────────────────
// IMAGE GENERATION — SVG objects with transparent background
// Each SVG is a recognizable object drawn with paths.
// Rendered to canvas — always transparent, no API needed.

const OBJECTS = [
  // Rose flower
  (w,h) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${w}" height="${h}">
    <ellipse cx="50" cy="55" rx="22" ry="28" fill="#e63946"/>
    <ellipse cx="38" cy="48" rx="16" ry="20" fill="#f4a261" opacity=".85"/>
    <ellipse cx="62" cy="48" rx="16" ry="20" fill="#c1121f" opacity=".85"/>
    <ellipse cx="50" cy="40" rx="14" ry="18" fill="#e63946"/>
    <ellipse cx="50" cy="35" rx="8" ry="10" fill="#f4a261" opacity=".9"/>
    <path d="M50 80 Q44 92 38 98" stroke="#2d6a4f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="36" cy="91" rx="10" ry="6" fill="#40916c" transform="rotate(-30,36,91)"/>
  </svg>`,

  // Butterfly
  (w,h) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${w}" height="${h}">
    <ellipse cx="28" cy="38" rx="24" ry="18" fill="#f4a261" opacity=".9" transform="rotate(-25,28,38)"/>
    <ellipse cx="72" cy="38" rx="24" ry="18" fill="#f4a261" opacity=".9" transform="rotate(25,72,38)"/>
    <ellipse cx="32" cy="65" rx="16" ry="12" fill="#e63946" opacity=".85" transform="rotate(20,32,65)"/>
    <ellipse cx="68" cy="65" rx="16" ry="12" fill="#e63946" opacity=".85" transform="rotate(-20,68,65)"/>
    <ellipse cx="28" cy="38" rx="14" ry="10" fill="#ffbe0b" opacity=".7" transform="rotate(-25,28,38)"/>
    <ellipse cx="72" cy="38" rx="14" ry="10" fill="#ffbe0b" opacity=".7" transform="rotate(25,72,38)"/>
    <path d="M50 25 Q48 50 50 75 Q52 50 50 25" stroke="#1a1a2e" stroke-width="3" fill="none"/>
    <circle cx="50" cy="23" r="4" fill="#1a1a2e"/>
    <path d="M50 20 Q42 10 36 14 M50 20 Q58 10 64 14" stroke="#1a1a2e" stroke-width="1.5" fill="none"/>
  </svg>`,

  // Camera
  (w,h) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${w}" height="${h}">
    <rect x="10" y="32" width="80" height="52" rx="8" fill="#2b2d42"/>
    <rect x="30" y="22" width="28" height="14" rx="4" fill="#2b2d42"/>
    <circle cx="50" cy="58" r="18" fill="#8d99ae"/>
    <circle cx="50" cy="58" r="13" fill="#edf2f4"/>
    <circle cx="50" cy="58" r="9" fill="#457b9d"/>
    <circle cx="50" cy="58" r="5" fill="#1d3557"/>
    <circle cx="54" cy="54" r="2" fill="white" opacity=".6"/>
    <rect x="70" y="40" width="10" height="7" rx="2" fill="#e63946"/>
    <circle cx="20" cy="42" r="4" fill="#457b9d"/>
  </svg>`,

function svgToCanvas(svgStr, tw, th) {
  return new Promise(resolve => {
    const blob = new Blob([svgStr], {type:'image/svg+xml'});
    const url  = URL.createObjectURL(blob);
    const img  = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = tw; c.height = th;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, tw, th);
      ctx.drawImage(img, 0, 0, tw, th);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

async function loadTray(query='') {
  tray.innerHTML='';

  // Show skeletons
  for (let i=0; i<THUMB_COUNT; i++) {
    const tw=Math.round(THUMB_H*ASPECTS[i%ASPECTS.length]);
    const sk=document.createElement('div');
    sk.className='thumb loading'; sk.id='sk'+i; sk.style.width=tw+'px';
    tray.appendChild(sk);
  }

  // Pick a shuffled set of objects based on query seed
  const seed  = query ? query.split('').reduce((a,c)=>a+c.charCodeAt(0),0) : Math.floor(Math.random()*9999);
  const order = [...Array(OBJECTS.length).keys()].sort(()=>(seed%7)-3.5+(Math.random()-0.5));
  const picks = order.slice(0, THUMB_COUNT);

  await Promise.all(picks.map(async (objIdx, i) => {
    const tw  = Math.round(THUMB_H*ASPECTS[i%ASPECTS.length]);
    const th  = THUMB_H;
    const svg = OBJECTS[objIdx](tw*2, th*2);
    const src = await svgToCanvas(svg, tw*2, th*2);
    const sk  = document.getElementById('sk'+i);
    if (src && sk?.isConnected) setThumb(sk, src, tw, th);
  }));
}

function setThumb(sk, src, tw, th) {
  if (!sk?.isConnected) return;
  sk.className = 'thumb ready';
  sk.style.cssText = `width:${tw}px;height:${th}px;`
    + `transform:rotate(${(Math.random()-0.5)*14}deg);`
    + `margin-top:${(Math.random()-0.5)*16}px;`
    + `background:repeating-conic-gradient(#2a2a2a 0% 25%,#1e1e1e 0% 50%) 0 0/8px 8px;`;
  sk._src=src; sk._w=tw; sk._h=th;
  const c=document.createElement('canvas'); c.width=tw; c.height=th;
  c.getContext('2d').drawImage(src, 0, 0, tw, th);
  c.style.cssText='display:block;height:100%;width:auto;pointer-events:none;';
  sk.appendChild(c);
}

// ─────────────────────────────────────────────────────
document.getElementById('btn-search').addEventListener('click',()=>{
  const q=document.getElementById('q').value.trim(); document.getElementById('q').blur(); loadTray(q);
});
document.getElementById('btn-refresh').addEventListener('click',()=>{
  document.getElementById('q').value=''; loadTray('');
});
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('btn-search').click(); });
document.getElementById('btn-undo').addEventListener('click',()=>{
  if (!undoStack.length) return; items=items.filter(p=>p.id!==undoStack.pop()); updateUI(); redraw();
});
document.getElementById('btn-save').addEventListener('click',()=>{
  if (!items.length) return;
  const out=document.createElement('canvas'); out.width=cvs.width; out.height=cvs.height;
  out.getContext('2d').drawImage(cvs,0,0);
  const a=document.createElement('a'); a.download=`collage-${Date.now()}.png`; a.href=out.toDataURL('image/png'); a.click();
});
